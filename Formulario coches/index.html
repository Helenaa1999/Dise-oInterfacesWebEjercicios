<!--Se solicita maquetar un formulario web utilizando Bootstrap, HTML/CSS y JavaScript. El formulario estará relacionado con un servicio de venta de coches y deberá incluir los siguientes elementos:

Campos requeridos:
    Un input para ingresar el nombre del cliente.
    Un textarea para que el cliente pueda agregar comentarios o especificar detalles adicionales (por ejemplo, características deseadas del coche).
    Una lista de checkboxes para que el cliente seleccione las características adicionales deseadas del coche (por ejemplo: aire acondicionado, GPS, asientos de cuero).
    Un conjunto de radiobuttons para seleccionar el tipo de coche que desea (por ejemplo: Sedán, SUV, Deportivo).
    Un botón que permita enviar los datos y que al hacer clic imprima toda la información del formulario en la consola del navegador.
Estilo:
    Usa Bootstrap para diseñar y maquetar el formulario de forma responsiva.
    Organiza los elementos con un diseño limpio y fácil de usar (puedes apoyarte en un contenedor y filas/columnas para estructurar).
Validaciones (opcional):
    Validar que el campo de nombre no esté vacío antes de enviar el formulario.
    Si el campo de nombre está vacío, mostrar un mensaje de error estilizado con Bootstrap.
Comportamiento:
Al presionar el botón de enviar:
    Captura los datos ingresados en el formulario.
    Imprime los valores de todos los campos en la consola del navegador.
    Asegúrate de que los datos se presenten de forma legible (en formato JSON o similar).
Restricciones:
    Solo se permite el uso de HTML, CSS, Bootstrap, y JavaScript. No se debe usar ningún otro framework ni librería adicional.
Extras (opcional):
    Agrega un encabezado con el título "Formulario de Venta de Coches".
    Añade un breve mensaje de bienvenida al cliente antes del formulario.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class=headerContainer> 
        <div class="logo">
            <img src="./img/logo.png" alt="logo">
        </div>
        <div class="menuContainer">
            <ul>
                <li><a class="opcionesMenu" href="./index.html">Inicio</a></li>
                <li><a class="opcionesMenu" href="#">Modelos</a></li>
                <li><a class="opcionesMenu" href="./index.html">Elige tu coche</a></li>
                <li><a class="opcionesMenu" href="#">Contacto</a></li>
            </ul>
        </div>
    </header>
    <main class="mainContainer">
        <form action="">
            <h2>Formulario de Venta de Coches</h2>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="nombre">Nombre del cliente: </label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" required>
                </div>
                <div class="col-md-6 mb3">
                    <label class="form-label" for="comentarios">Comentarios: </label>
                    <textarea name="comentarios" id="comentarios" placeholder="Introduce toda la información que consideres oportuna"></textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="caracteristicasAdicionales" class="form-label">Características adicionales deseadas: </label>
                    <div>
                        <input type="checkbox" id="aireAcondicionado" name="caracteristicasAdicionales" class="form-check-input">
                        <label for="caracteristicasAdicionales" id="aireAcondicionado" class="form-check-label">Aire acondicionado</label>
                    </div>
                    <div>
                        <input type="checkbox" id="GPS" name="caracteristicasAdicionales" class="form-check-input">
                        <label for="caracteristicasAdicionales" id="GPS" class="form-check-label">GPS</label>
                    </div>
                    <div>
                        <input type="checkbox" id="asientosCuero" name="caracteristicasAdicionales" class="form-check-input">
                        <label for="caracteristicasAdicionales" id="asientosCuero" class="form-check-label">Asientos de cuero</label>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label  class="form-label"f or="tipoCoche">Tipo de coche</label>
                    <div>
                        <input type="radio" class="form-check-input" id="tipoCoche" name="tipoCoche" value="sedán">
                        <label for="tipoCoche" class="form-check-label">Sedán</label>
                    </div>
                    <div>
                        <input type="radio" class="form-check-input" id="tipoCoche" name="tipoCoche" value="SUV">
                        <label for="tipoCoche" class="form-check-label">SUV</label>
                    </div>
                    <div>
                        <input type="radio" class="form-check-input" id="tipoCoche" name="tipoCoche" value="deportivo">
                        <label for="tipoCoche" class="form-check-label">Deportivo</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mb-3 btnContainer">
                    <button type="button" class="btn btn-primary">Enviar</button>
                </div>
            </div>
        </form>
    </main>
    <footer class="footerContainer">
        <div>
            <h3>Dónde estamos</h3>
            <p>c/ Vara del rey 8, 28333, Madrid</p>
        </div>
        <div>
            <h3>Contacto</h3>
            <p>Citas: +34 633 333 333</p>
            <p>Atención al cliente: +34 644 444 444</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
